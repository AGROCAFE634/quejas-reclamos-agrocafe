<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AGROCAFÉ | Quejas y Reclamos</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f7f7f4;
  color:#25352d;
}
.page{
  width:min(100%,520px);
  margin:auto;
  padding:28px 20px 35px;
  text-align:center;
}
.logo{
  width:min(100%,330px);
  height:auto;
  display:block;
  margin:0 auto 18px;
  background:#fff;
}
h1{
  margin:0;
  font-size:24px;
  color:#50351a;
}
.intro{
  margin:8px auto 22px;
  max-width:420px;
  color:#70756f;
  font-size:14px;
  line-height:1.45;
}
.links{
  display:flex;
  flex-direction:column;
  gap:11px;
}
.card{
  display:flex;
  align-items:center;
  gap:14px;
  text-align:left;
  text-decoration:none;
  color:#25352d;
  background:#fff;
  border:1px solid #e5e5df;
  border-radius:14px;
  padding:13px 15px;
  box-shadow:0 2px 8px rgba(35,55,43,.05);
  transition:.15s ease;
}
.card:hover{
  transform:translateY(-1px);
  box-shadow:0 4px 12px rgba(35,55,43,.09);
}
.icon{
  width:43px;
  height:43px;
  flex:0 0 43px;
  border-radius:11px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#edf3e7;
  font-size:20px;
}
.title{
  font-weight:700;
  font-size:15px;
  margin-bottom:3px;
  color:#50351a;
}
.data{
  font-size:13px;
  color:#777b75;
  line-height:1.35;
  word-break:break-word;
}
.form{
  background:#6f4b25;
  border-color:#6f4b25;
  color:#fff;
}
.form .icon{
  background:rgba(255,255,255,.16);
}
.form .title,.form .data{
  color:#fff;
}
.footer{
  margin-top:22px;
  font-size:11px;
  color:#8a918d;
  line-height:1.4;
}
@media(max-width:360px){
  .page{padding-left:14px;padding-right:14px}
}
</style>
